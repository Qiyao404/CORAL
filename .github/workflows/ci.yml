name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          # Node 20 为声明的最低支持版本，仅在 ubuntu 上验证
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build (server, tsc)
        run: npm run build:server

      - name: Test (vitest)
        run: npm test

      - name: Build (web, tsc + vite)
        run: npm run build:web

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coral-progress"
version = "0.1.0"
description = "CORAL_PROGRESS protocol SDK for Python — emit progress, logs and artifacts from CORAL skill scripts (or any child process) via single-line JSON on stderr."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["coral", "agent", "progress", "stderr", "protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Qiyao404/CORAL"

[tool.setuptools]
packages = ["coral_progress"]
